version: '3.8'

services:
  # 1. 缓存层：风控词库与热点缓存
  redis:
    image: redis:latest
    container_name: xhs-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass qq15160160
    restart: always

  # 2. 数据库：主库 + 向量审计库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xhs-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qq151601601
      POSTGRES_DB: LangChainProject
    restart: always

  # 3. 后端服务 (FastAPI + LangGraph)
  backend:
    build:
      context: ./AI_Frontend_IDE
      dockerfile: Dockerfile
    container_name: xhs-backend
    ports:
      - "8000:8000"
    env_file:
      - ./AI_Frontend_IDE/.env
    # 强制覆盖 .env 中的连接地址，使其在 Docker 内部互通
    environment:
      - REDIS_URL=redis://:qq15160160@redis:6379/0
      - POSTGRES_URL=postgresql://postgres:qq151601601@postgres:5432/LangChainProject
      - PGVector_URL=postgresql+psycopg://postgres:qq151601601@postgres:5432/LangChainProject
    depends_on:
      - redis
      - postgres
    restart: always

  # 4. 前端服务 (Vue 3 + Vite)
  frontend:
    build:
      context: ./ai-frontend-ide
      dockerfile: Dockerfile
    container_name: xhs-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
